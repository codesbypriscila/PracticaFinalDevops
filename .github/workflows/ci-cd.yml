name: CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-test-push-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./Dockerfile
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hola-mundo-devops:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hola-mundo-devops:${{ github.sha }}

      - name: Trigger Render deploy (Deploy Hook)
        if: ${{ success() }}
        run: |
          if [ -n "${{ secrets.RENDER_HOOK_URL }}" ]; then
            curl -sS -X POST "${{ secrets.RENDER_HOOK_URL }}"
          else
            echo "No RENDER_HOOK_URL provided. Skipping Render trigger."
          fi
